<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width,initial-scale=1">
<title>Handball Ultimate Karriere</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: Karrieremodus-Zentrale nach dem Training, laut und klar, mit Kartenglanz
   IDEA: die Hallenanzeige und der Hallenboden mit 6- und 9-Meter-Linien
   PICTURE: das nächste Spiel auf dem Hallenboden, Wappen gross, Sammelkarten im FC-Stil
   COLOUR and TYPE: Graphit, Hallenblau als Fläche, Harz-Orange als Akzent; Barlow Condensed und Barlow
   LAYOUT: Kopfleiste, Reiter, eine grosse Bühne pro Ansicht, Kacheln darunter */
:root{color-scheme:dark;--bg:#0f1215;--p1:#171b20;--p2:#20262d;--p3:#2a313a;--line:#313943;--ink:#eef1f4;--mut:#9ba5af;--acc:#ff5b2e;--court:#1b4a8f;--court2:#123565;--win:#3ccf8e;--loss:#ff5a6a;--draw:#c9d1d9}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,4vw,36px)}h3{font-size:22px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(3vw,14px);background:#0a0c0e;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{font:800 22px/1 'Barlow Condensed';display:flex;align-items:center;gap:8px}
.logo span{background:var(--acc);color:#111;padding:2px 7px;border-radius:4px}
.tinfo{display:flex;gap:16px;align-items:center;margin-left:auto;flex-wrap:wrap;font-family:'Barlow Condensed';font-size:18px;font-weight:600}
.coin{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.coin i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#d9a521 60%,#8f6a0c);display:inline-block;flex:none}
.pips{display:inline-flex;gap:3px;align-items:center}.pips b{width:9px;height:16px;border-radius:2px;background:var(--p3)}.pips b.on{background:var(--acc)}
.tabs{display:flex;gap:4px;padding:0 max(3vw,14px);background:var(--p1);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:var(--th,52px);z-index:19}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px 10px;font:600 18px 'Barlow Condensed';color:var(--mut);min-height:46px}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1240px;margin:0 auto;padding:22px max(3vw,14px) 60px}
.btn{background:var(--acc);color:#140804;border:0;border-radius:8px;padding:11px 20px;font:700 18px 'Barlow Condensed';min-height:44px;white-space:nowrap}
.btn.sec{background:var(--p3);color:var(--ink)}.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.sm{font-size:14px}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin-top:14px}
.tag{display:inline-block;font:700 14px 'Barlow Condensed';padding:2px 9px;border-radius:20px;background:var(--p3)}
.tag.hot{background:var(--acc);color:#140804}
/* hero court */
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--court),var(--court2));padding:clamp(20px,4vw,40px);min-height:330px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.hero svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(svg){position:relative}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.crest{width:clamp(64px,12vw,104px);aspect-ratio:1;border-radius:50% 50% 46% 46%;background:var(--tc);display:grid;place-items:center;margin:0 auto 8px;font:800 clamp(20px,3.6vw,32px) 'Barlow Condensed';color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.85)}
.crest.s{width:30px;border-width:2px;font-size:12px;margin:0;box-shadow:none;flex:none}
.tname{font:700 clamp(18px,2.6vw,26px) 'Barlow Condensed'}
.vsx{font:800 clamp(30px,6vw,54px) 'Barlow Condensed';opacity:.9}
/* cards */
.card{--cw:150px;width:var(--cw);aspect-ratio:.7;font-size:calc(var(--cw)/11);position:relative;clip-path:polygon(0 5%,16% 0,84% 0,100% 5%,100% 88%,50% 100%,0 88%);padding:.9em .8em 1.6em;display:flex;flex-direction:column;background:var(--g);font-family:'Barlow Condensed',sans-serif;cursor:pointer;flex:none;transition:transform .15s;border:0;text-align:left;line-height:1.1}
.card:hover{transform:translateY(-3px)}
.card.s{--cw:112px}.card.xs{--cw:clamp(62px,14vw,100px)}.card.big{--cw:min(250px,62vw)}
.cv{position:absolute;left:.75em;top:1.1em;text-align:center;line-height:1;z-index:1}
.co{font-size:2.7em;font-weight:800}.cp{font-size:1.15em;font-weight:700}
.cc{margin:.35em auto 0;width:2.1em;height:2.1em;border-radius:50%;background:var(--tc);color:#fff;font-size:.75em;display:grid;place-items:center;font-weight:700}
.sil{position:absolute;right:.2em;top:.9em;width:66%;height:46%;fill:var(--sc,currentColor);opacity:.5}
.cn{margin-top:auto;text-align:center;font-weight:800;font-size:1.32em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.15em;border-bottom:1px solid;border-color:color-mix(in srgb,currentColor 35%,transparent)}
.cs{display:grid;grid-template-columns:repeat(3,1fr);gap:.05em .2em;font-size:.98em;margin-top:.3em;text-align:center}
.cs span{white-space:nowrap}.cs b{font-weight:800;margin-right:.2em}
.ca{display:flex;flex-wrap:wrap;gap:.2em;justify-content:center;margin-top:.35em;min-height:1.2em}
.ca i{font-style:normal;font-size:.8em;font-weight:700;padding:.05em .45em;border-radius:1em;background:rgba(0,0,0,.2);white-space:nowrap}
.cver{text-align:center;font-size:.72em;font-weight:700;opacity:.85;margin-top:.3em}
.xs .ca,.xs .cver,.xs .cs,.xs .cnat,.xs .lbadge{display:none}.xs .cn{font-size:1.5em;margin-top:auto}.xs .co{font-size:3em}
.bronze{--g:linear-gradient(155deg,#f2c9a3,#ad6d42 58%,#7a4526);color:#2b1609}
.silber{--g:linear-gradient(155deg,#f6f8fa,#bcc6ce 55%,#8995a0);color:#1b232a}
.gold{--g:linear-gradient(155deg,#fff2b0,#e4bb3e 55%,#b0861b);color:#2e2208}
.gold.rare{--g:linear-gradient(155deg,#fffbe0,#f1c947 45%,#c9951c 70%,#8c6410);}
.inform{--g:linear-gradient(155deg,#474747,#141414 55%,#000);color:#f4d57e}
.held{--g:linear-gradient(155deg,#ff9b8a,#d0142f 55%,#4a0610);color:#fff}
.zukunft{--g:linear-gradient(155deg,#9af2ff,#16a5d6 50%,#0a3f75);color:#fff}
.ikone{--g:linear-gradient(155deg,#fffdf7,#f0e3bd 55%,#c6a35b);color:#3a2a08}
.jugend{--g:linear-gradient(155deg,#f3c6ff,#b44ae6 45%,#5a138f 75%,#2a0548);color:#fff}
.inform .ca i,.held .ca i,.zukunft .ca i{background:rgba(255,255,255,.16)}
.cardbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px 10px;justify-items:center;margin-top:14px}
.cgrid .card{--cw:118px}
/* court */
.court{position:relative;aspect-ratio:1/0.92;max-width:640px;width:100%;margin:0 auto;border-radius:16px;background:linear-gradient(180deg,var(--court),var(--court2));overflow:hidden}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0}
.slot .lab{font:700 13px 'Barlow Condensed';background:rgba(0,0,0,.45);padding:1px 8px;border-radius:10px;white-space:nowrap}
.empty{background:none;font-family:inherit;cursor:pointer;width:clamp(62px,14vw,100px);aspect-ratio:.7;border:2px dashed rgba(255,255,255,.5);border-radius:8px;display:grid;place-items:center;font:700 14px 'Barlow Condensed';color:#fff}
.form-up{color:var(--win)}.form-dn{color:#7cc7ff}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,7,9,.86);z-index:50;display:none;overflow:auto;padding:24px 14px}
.ov.on{display:block}
.box{max-width:900px;margin:0 auto;background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px)}
.x{float:right;background:var(--p3);border:0;border-radius:8px;width:44px;height:44px;font-size:22px}
.bar{height:8px;background:var(--p3);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stl{display:grid;grid-template-columns:7.5em 2.2em 1fr;gap:8px;align-items:center;font-size:15px}
/* seg */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{background:var(--p2);border:2px solid var(--line);border-radius:10px;padding:10px;text-align:left;min-height:44px}
.seg button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--p2))}
.seg b{display:block;font:700 19px 'Barlow Condensed'}
.seg small{color:var(--mut);font-size:13px;line-height:1.3;display:block}
.cmp{display:grid;grid-template-columns:3em 1fr 6em 1fr 3em;gap:8px;align-items:center;font:600 16px 'Barlow Condensed';margin-top:8px}
.cmp .l{justify-self:end;width:100%;display:flex;justify-content:flex-end}.cmp .bar{width:100%}
.cmp .l .bar i{margin-left:auto}.cmp .c{text-align:center;color:var(--mut)}
/* match */
.board{background:#07090b;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.score{font:800 clamp(52px,11vw,96px)/1 'Barlow Condensed';color:#ffd25a;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock{font:700 22px 'Barlow Condensed';color:var(--acc)}
.tick{list-style:none;margin:14px 0 0;padding:0;max-height:430px;overflow:auto}
.tick li{display:grid;grid-template-columns:3em 1fr auto;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px;align-items:center}
.tick li.g-me{background:color-mix(in srgb,var(--acc) 15%,transparent)}
.tick .m{font:700 16px 'Barlow Condensed';color:var(--mut)}
.tick .sc{font:700 16px 'Barlow Condensed';white-space:nowrap}
/* upgrades */
.upg{background:var(--p2);border:2px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.upg:hover{border-color:var(--acc)}.upg b{font:700 22px 'Barlow Condensed'}
.upg .k{font:700 13px 'Barlow Condensed';color:var(--acc)}
/* packs */
.pk{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-height:190px;border:1px solid var(--line)}
.pk h3{font-size:26px}.pk .btn{margin-top:auto;align-self:flex-start}
.pk.bronze,.pk.silber,.pk.gold,.pk.ikone,.pk.jugend{color:#1d1406}
.pk.offer{background:linear-gradient(150deg,#3a1d10,#1b1113);border-color:var(--acc)}
.reveal{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:18px 0}
.back{width:var(--cw,128px);aspect-ratio:.7;clip-path:polygon(0 5%,16% 0,84% 0,100% 5%,100% 88%,50% 100%,0 88%);background:repeating-linear-gradient(45deg,#232a33 0 8px,#1a2027 8px 16px);display:grid;place-items:center;font:800 30px 'Barlow Condensed';color:var(--acc)}
.flip{animation:flip .55s ease-out}
@keyframes flip{from{transform:rotateY(90deg) scale(.9);opacity:.2}to{transform:none;opacity:1}}
.walk{position:relative;text-align:center;padding:40px 10px;min-height:340px;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--wc) 55%,transparent),transparent 65%);border-radius:16px}
.walk div{font:800 clamp(40px,10vw,84px)/1 'Barlow Condensed';opacity:0;animation:wi .5s forwards}
.walk div:nth-child(2){animation-delay:.7s}.walk div:nth-child(3){animation-delay:1.4s;color:#ffd25a}
.walk .w{display:grid;gap:14px}
@keyframes wi{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.flip,.walk div{animation:none;opacity:1}.card{transition:none}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#111;padding:10px 18px;border-radius:10px;font-weight:600;z-index:80;max-width:90vw}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font:600 15px 'Barlow Condensed';color:var(--mut)}
td.t,th.t{text-align:left;white-space:normal}
tr.me td{background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:600}
td.z1{box-shadow:inset 4px 0 #ffd25a}td.z3{box-shadow:inset 4px 0 var(--court)}td.zd{box-shadow:inset 4px 0 var(--loss)}
.scroll{overflow-x:auto}
.res{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font:700 15px 'Barlow Condensed';color:#111}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}
.fil{display:flex;gap:6px;flex-wrap:wrap}
.fil button{background:var(--p2);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font:600 16px 'Barlow Condensed';min-height:40px}
.fil button.on{background:var(--acc);color:#140804;border-color:var(--acc)}
select,input{font:inherit;font-size:16px;background:var(--p2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.title{min-height:calc(100vh - 120px);display:grid;place-items:center;text-align:center}
.title h1{font-size:clamp(44px,9vw,92px);font-weight:800}
.title h1 em{font-style:normal;color:var(--acc)}
.fan{display:flex;justify-content:center;margin:26px 0}
.fan .card{margin:0 -22px;box-shadow:none}
.fan .card:nth-child(1){transform:rotate(-12deg) translateY(16px)}.fan .card:nth-child(3){transform:rotate(12deg) translateY(16px)}.fan .card:nth-child(2){z-index:2}
@media(max-width:820px){.two{grid-template-columns:1fr}}
@media(max-width:600px){.seg{grid-template-columns:1fr}.cmp{grid-template-columns:2.4em 1fr 4.6em 1fr 2.4em;font-size:14px}.tinfo{gap:10px;font-size:16px;margin-left:0}.hide-s{display:none}table{font-size:13px}.cgrid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}.cgrid .card{--cw:100px}}

.cnat{margin-top:.3em;font-size:.72em;font-weight:700;opacity:.85}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}.info span{color:var(--mut)}
.thb{background:none;border:0;color:var(--mut);font:600 15px 'Barlow Condensed';padding:4px 2px;min-height:32px}.thb.on{color:var(--acc)}
table.db td{font-size:14px;padding:7px 6px}table.db tr:hover td{background:var(--p2)}
.ovr{display:inline-block;min-width:2.2em;text-align:center;font:800 16px 'Barlow Condensed';padding:2px 4px;border-radius:5px;background:var(--g);color:#1d1406}
.ovr.inform,.ovr.held,.ovr.zukunft{color:#fff}
.title label{font:600 15px Barlow;color:var(--mut)}

.seg.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tds{--g:linear-gradient(155deg,#2b2f36,#0b0d10 55%,#000);color:#7fe3ff}
.sds{--g:linear-gradient(155deg,#ffb36b,#e2361d 50%,#6e0d12);color:#fff}
.tds .ca i,.sds .ca i{background:rgba(255,255,255,.16)}
.pk.live-tds{background:linear-gradient(150deg,#14303c,#0b1216);border-color:#7fe3ff}
.pk.live-sds{background:linear-gradient(150deg,#5a1a12,#1b0d0e);border-color:#ff8a3d}
@media(max-width:820px){.seg.s4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.seg.s4{grid-template-columns:1fr}}
.card.boosted{box-shadow:none;filter:drop-shadow(0 0 6px #ffb36b)}
.lbadge{position:absolute;top:2%;left:50%;transform:translateX(-50%);z-index:2;background:#ff5b2e;color:#140804;font-size:.7em;font-weight:800;padding:.05em .5em;border-radius:1em;white-space:nowrap}

.gem{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.gem i{width:13px;height:13px;transform:rotate(45deg);background:linear-gradient(135deg,#b6f3ff,#3fb6ff 55%,#1a5fb4);display:inline-block;border-radius:2px}
.clist{display:grid;gap:8px;margin-top:10px;max-height:620px;overflow:auto}.crow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px}.crow.locked{opacity:.75}.crow .btn{padding:8px 12px;font-size:16px}
.sw input{position:absolute;opacity:0}.sw span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;cursor:pointer}.sw input:checked+span{border-color:#fff}.sw input:focus-visible+span{outline:2px solid #fff}
.tgl{gap:10px;cursor:pointer;margin:10px 0;flex-wrap:nowrap;align-items:flex-start}.tgl input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px}
.doc{max-width:860px}.doc.wide{max-width:1100px}.doc h3{margin-top:22px}.doc p{max-width:70ch}
.panel.done{border-color:var(--win)}.boost.on{border-color:var(--acc)}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.mhead .crest{width:64px}
.fwrap{margin-top:8px;border-radius:14px;overflow:hidden;background:#123565}#fld{display:block;width:100%;height:auto}
.pl{transition:transform .45s ease}.pl text{font:700 7px 'Barlow Condensed',sans-serif;text-anchor:middle}
#ball{transition:transform .32s ease-out}#flash{font:800 34px 'Barlow Condensed';fill:#ffd25a;opacity:0;paint-order:stroke;stroke:#000;stroke-width:3px}#flash.on{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.mctrl{margin-top:10px}.mctrl .btn{padding:8px 14px;font-size:16px;min-height:40px}
.srow{display:grid;grid-template-columns:3.6em 1fr 2.2em 70px;gap:8px;align-items:center;width:100%;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0;text-align:left;min-height:40px}
.srow.sel{border-color:var(--acc)}.srow.big{grid-template-columns:3em 1fr 3em;font-size:17px;min-height:48px}.srow .sl{font:700 14px 'Barlow Condensed';color:var(--mut)}.srow .so{font:800 17px 'Barlow Condensed';text-align:right}
.fb{height:6px;background:var(--p3);border-radius:4px;overflow:hidden}.fb i{display:block;height:100%}
.kick{color:var(--acc);font:700 16px 'Barlow Condensed';margin:0 0 4px}.bigsc{font:800 40px 'Barlow Condensed';color:#ffd25a;margin:6px 0}
.cuprow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.cuprow span:last-child{text-align:right}.cuprow .w{font-weight:700}.cuprow.me{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.gala{position:relative;overflow:hidden;border-radius:20px;padding:clamp(20px,4vw,48px);background:radial-gradient(circle at 50% 18%,#4a3610,#14100a 55%,#07060a);text-align:center;color:#f7ecd0}
.gala .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 50% 30%,rgba(255,214,120,.09) 0 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite}

.gk1{position:relative;font:600 18px 'Barlow Condensed';color:#e9c873;margin:0}.gtitle{position:relative;font:800 clamp(36px,7vw,64px)/1 'Barlow Condensed';background:linear-gradient(180deg,#fff7d6,#e3b443 60%,#9c6b10);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 18px}.gtitle.sm2{font-size:clamp(28px,5vw,44px);margin-top:30px}

function poolPick0(a,wf){let tot=0;const w=a.map(t=>{const x=wf?wf(t):1;tot+=x;return x});let r=Math.random()*tot;for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}return a[a.length-1]}

function guideView(){return `<article class="doc"><h2>Spielanleitung</h2>
 <h3>Das Ziel</h3><p>Du führst einen Verein durch die Handball-Bundesliga mit 18 Teams und spielst parallel im Pokal. Wer am Ende oben steht, ist Meister, die letzten zwei steigen ab. Sieg 2 Punkte, Unentschieden 1 Punkt.</p>
 <h3>Karriere und Freischaltungen</h3><p>Am Anfang gibt es nur den eigenen Verein. Er startet mit einem zufälligen Startkader von rund 40 Spielern, davon 2 mit 80+. Fehlt eine Position, kommt ein Jugendspieler dazu. Auf dem Spielermarkt kommen und gehen jeden Spieltag Spieler, die du direkt kaufen kannst. Erfüllst du Ziele wie «Obere Tabellenhälfte» oder «Pokalsieger», werden Bundesligisten freigeschaltet, von schwach nach stark. Die Ziele gehen der Reihe nach, pro Saison höchstens zwei. Stärkere Vereine haben bessere Spieler und mehr Budget. Gesperrte Vereine kannst du auch mit Gems kaufen.</p>
 <h3>Saisonvorbereitung und Gems</h3><p>Vor jeder Saison kaufst du mit Gems Boosts, die eine Saison lang wirken, etwa Trainingslager (+2 auf alle Werte) oder Hauptsponsor (+30 % Einnahmen). Gems gibt es für die Tabellenplatzierung, Runden im Pokal und Spieler im Team der Saison.</p>
 <h3>Kader</h3><p>Du stellst eine Angriffs-Sieben und eine Abwehr auf. Mit dem Angriff-Abwehr-Wechsel setzt du Spezialisten nur in der Abwehr ein. Pro Spiel dürfen nur 16 Spieler mit, der Rest sitzt auf der Tribüne. Den 16er-Kader legst du in der Spielerkarte fest.</p>
 <h3>Spieltag</h3><p>Vor dem Spiel wählst du die Taktik: Angriffsstil, Tempo, Abwehrformation, Abwehrhaltung, Verhalten in Unterzahl und 7 gegen 6. Jede Abwehr stoppt einen Angriffsstil und ist gegen einen anderen anfällig, das Scouting zeigt, wie der Gegner spielt. Dann spielst du live oder simulierst schnell.</p>
 <h3>Live-Spiel</h3><p>Du siehst das Feld mit allen 14 Spielern. Mit Pause kannst du wechseln, die Taktik ändern und einen gegnerischen Star in Manndeckung nehmen. Spieler werden müde, frische Spieler von der Bank helfen. Das Spiel hält an bei Halbzeit, bei einer Zeitstrafe gegen dich (Torhüter raus?), bei einem Siebenmeter für dich (wer wirft?) und in der Crunchtime, wenn es in den letzten 10 Minuten knapp ist.</p>
 <h3>Nach dem Spiel</h3><p>Du wählst eines von drei Upgrades. Siege bringen Geld, Siege in Topspielen gegen die Top 4 zusätzlich ein Gold-Pack. Vor jedem Topspiel gibt es im Shop ein Topspiel-Pack mit einem Spieler ab 83 bis 86, je nach Gegner.</p>
 <h3>Shop</h3><p>Packs, Spieltag-Angebote, Transfermarkt mit einzelnen Spielern und die Live-Spieler des echten Spieltags. Spieler, die du nicht brauchst, verkaufst du für Geld.</p>
 <h3>Saisonende</h3><p>Nach dem letzten Spieltag kommt die Gala mit dem Team der Saison und dem Spieler der Saison. Danach geht es mit dem gleichen Kader in die nächste Saison, die Gegner werden stärker. Im Menü kannst du die Saison jederzeit abbrechen.</p></article>`}
